name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Bundle the JavaScript into the debug APK so it runs without a dev server.
      # A debug-signed APK keeps the same signature as earlier versions of the app,
      # so it installs as an update and keeps the existing data.
      - name: Enable JS bundling in debug builds
        run: sed -i 's/react {/react {\n    debuggableVariants = []/' android/app/build.gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "DinisMoneyJar-2.0.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinisMoneyJar-APK
          path: DinisMoneyJar-2.0.apk
          retention-days: 30
